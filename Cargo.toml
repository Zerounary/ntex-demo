[package]
name = "ntex-demo"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ntex = { version = "2.17.0", features = ["tokio"] }
ntex-files = "2.1.0"
dotenv = "0.15"
sea-orm = { version = "0.12", features = ["macros", "runtime-tokio-native-tls", "sqlx-mysql"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
struct-convert = "1.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
log = "0.4"
moka = { version = "0.12", features = ["future"] }
once_cell = "1.19"
rand = "0.8"

